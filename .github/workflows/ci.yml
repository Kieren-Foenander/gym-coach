name: CI

# Lint, typecheck and tests for the web app, the server and the native app, and the browser tests. Runs on
# every pull request, and deploy.yml calls it before a production deploy. Every job is a required check on
# master: a pull request cannot merge until they pass. The fast ones also run before every push
# (.githooks/pre-push); the browser tests run locally with `bun run e2e`.
on:
  pull_request:
  workflow_call:
  # The "Update screenshots" workflow starts this on the commit it makes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the migration check can compare with the base branch.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Deployed databases have already run every migration on master, so a pull request may only add new ones.
      - name: Migrations are only added
        if: github.event_name == 'pull_request'
        run: bun tools/check-migrations.ts "origin/${{ github.base_ref }}"
      # Type-aware lint (oxlint with tsrs) also covers apps/mobile, so it needs that app's packages to resolve its types.
      - run: bun install --frozen-lockfile
        working-directory: apps/mobile
      - run: bun run check

  mobile:
    name: Native app typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The native app shares src/domain with the web app and reads the server's types, so both installs are needed.
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: apps/mobile
      - run: bun run check
        working-directory: apps/mobile

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright's own image, so screenshots render exactly as they were recorded (tools/e2e/screenshots.sh
    # uses the same one). Its version moves with the playwright-core that @e2e-dev/web pins;
    # test/playwright-image.test.ts checks.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      # setup-bun unpacks Bun with unzip, which the Playwright image leaves out.
      - run: apt-get update -qq && apt-get install -y -qq unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Serves its own copy of the app with a fresh local database (tools/e2e/serve.ts), so it needs no secrets.
      - run: bun run e2e
        env:
          # e2e sends anonymous usage data unless told not to.
          E2E_TELEMETRY_DISABLED: "1"
      # The report, and a trace page, screenshots and any missing or different screenshot for each failed test.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: .e2e
          include-hidden-files: true
          retention-days: 14
