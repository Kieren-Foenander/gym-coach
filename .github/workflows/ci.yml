name: CI

# Lint, typecheck and tests, for the web app, the server and the native app. Runs on every pull request, and
# deploy.yml calls it before a production deploy. Both jobs are required checks on master: a pull request
# cannot merge until they pass. The same checks run locally before every push (.githooks/pre-push).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the migration check can compare with the base branch.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Deployed databases have already run every migration on master, so a pull request may only add new ones.
      - name: Migrations are only added
        if: github.event_name == 'pull_request'
        run: bun tools/check-migrations.ts "origin/${{ github.base_ref }}"
      # Type-aware lint (oxlint with tsrs) also covers apps/mobile, so it needs that app's packages to resolve its types.
      - run: bun install --frozen-lockfile
        working-directory: apps/mobile
      - run: bun run check

  mobile:
    name: Native app typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The native app shares src/domain with the web app and reads the server's types, so both installs are needed.
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: apps/mobile
      - run: bun run check
        working-directory: apps/mobile
