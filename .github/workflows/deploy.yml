name: Deploy

# Alchemy deploys one stage per branch of work (see alchemy.run.ts):
#   a push to master         -> the "prod" stage, after the checks pass
#   a pull request           -> its own "pr-<number>" preview, with the address posted as a comment, then the
#                               browser tests marked @smoke run against it
#   closing the pull request -> that preview is destroyed
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

# One deploy at a time per stage, and never cancel one half way through.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'prod' }}
  cancel-in-progress: false

env:
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'prod' }}

jobs:
  check:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  production:
    name: Deploy production
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://gym.kfoenander98.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Deploy
        run: bun alchemy deploy --stage "$STAGE" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SIGNUP_CODE: ${{ secrets.SIGNUP_CODE }}

  # Pull requests from forks get no secrets, so they get checks (ci.yml) but no preview.
  preview:
    name: Deploy preview
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # A new invite code for each preview deploy, so the smoke tests below can make accounts after the
      # first one without the preview sharing the live app's code.
      - name: Make an invite code
        id: invite
        run: |
          code=$(openssl rand -hex 16)
          echo "::add-mask::$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Deploy
        id: deploy
        run: |
          set -o pipefail
          bun alchemy deploy --stage "$STAGE" --yes --no-input | tee deploy.log
          url=$(grep -oE "https://[a-z0-9.-]+\.workers\.dev" deploy.log | tail -1)
          if [ -z "$url" ]; then
            echo "The deploy printed no address" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SIGNUP_CODE: ${{ steps.invite.outputs.code }}
          PULL_REQUEST: ${{ github.event.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bunx playwright install --with-deps chromium
      # The browser tests marked @smoke, against the preview just deployed: the real Worker, D1 and KV.
      - name: Smoke test the preview
        run: bun run e2e
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
          E2E_INVITE_CODE: ${{ steps.invite.outputs.code }}
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: preview-smoke-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  cleanup:
    name: Destroy preview
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Refuse to destroy production
        run: |
          if [ "$STAGE" = "prod" ]; then
            echo "Refusing to destroy the prod stage" >&2
            exit 1
          fi
      - name: Destroy
        run: bun alchemy destroy --stage "$STAGE" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULL_REQUEST: ${{ github.event.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
